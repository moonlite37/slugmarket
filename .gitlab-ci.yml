build-image:
  stage: build
  image: docker:latest
  tags:
    - build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add nodejs npm
  script:
    - npm run package
  artifacts:
    paths:
      - cte-linux-amd64.tar
    expire_in: 1 hour
  only:
    - main
