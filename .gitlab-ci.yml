image: node:lts
variables:
  PIPELINE: 'true'
  POSTGRES_HOST: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
stages:
  - quality
  - test
  - build
quality:
  stage: quality
  script:
    - |
      for dir in Service/*/ App/Admin/ App/seller/backend/ App/seller/frontend/ App/shopper/backend/ App/shopper/frontend/; do
        [ -f "$dir/package.json" ] || continue
        cd $dir
        npm install
        npm run lint
        npm run cpd
        cd $CI_PROJECT_DIR
      done
app-test:
  stage: test
  script:
    - |
      for dir in App/Admin/ App/seller/frontend/ App/shopper/frontend/ App/seller/backend/ App/shopper/backend/; do
        [ -f "$dir/package.json" ] || continue
        cd $dir
        npm install
        npm test
        cd $CI_PROJECT_DIR
      done
microservice-test:
  stage: test
  services:
    - postgres
  before_script:
    - apt-get update -y
    - apt-get install -y postgresql-client
  script:
    - |
      for dir in Service/*/; do
        [ -f "$dir/package.json" ] || continue
        [ ! -f "${dir}sql/databases.sql" ] || PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U postgres -f ${dir}sql/databases.sql
        cd $dir
        npm install
        npm test
        cd $CI_PROJECT_DIR
      done
build:
  stage: build
  image: docker:24.0.5-cli
  tags:
    - build
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add nodejs npm
    - docker system prune -af || true
    - rm -f cte-linux-amd64.tar || true
  script:
    - echo "$ENV_BASE64" | base64 -d > .env
    - npm run package
    - ls -lh cte-linux-amd64.tar
