services:
  postgres:
    container_name: slug-market
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./sql:/sql
      - ./sql/databases.sql:/docker-entrypoint-initdb.d/1.databases.sql
      - ./sql/auth.connect.sql:/docker-entrypoint-initdb.d/2.auth.connect.sql
      - ./sql/listing.connect.sql:/docker-entrypoint-initdb.d/3.listing.connect.sql

volumes:
  postgres-data:
